<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketHisab - Forgot Password</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styles */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            padding: 20px;
        }

        /* Rainbow Background Animation */
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 35px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        /* Logo */
        .logo {
            text-align: center;
            font-size: 2.8rem;
            font-weight: bold;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Back to Login */
        .back-link {
            text-align: center;
            margin-bottom: 25px;
        }

        .back-link a {
            color: #333;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-link a:hover {
            color: #ff6b6b;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3);
        }

        /* Progress Steps */
        .progress-steps {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .step.active .step-circle {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
        }

        .step.completed .step-circle {
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            color: white;
        }

        .step-text {
            font-size: 12px;
            color: #666;
        }

        .step.active .step-text {
            color: #333;
            font-weight: 600;
        }

        /* OTP Section */
        .otp-section {
            margin: 20px 0;
            text-align: center;
        }

        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        .otp-input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
        }

        .otp-timer {
            font-size: 14px;
            color: #666;
            margin: 10px 0;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.3);
            color: #333;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        /* Message Box */
        .message {
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.2);
            color: #2e7d32;
            border: 1px solid #4caf50;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.2);
            color: #c62828;
            border: 1px solid #f44336;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 10px;
            height: 5px;
            border-radius: 5px;
            background: #eee;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }

        .strength-weak {
            background: #ff6b6b;
            width: 33%;
        }

        .strength-medium {
            background: #ffa726;
            width: 66%;
        }

        .strength-strong {
            background: #4ecdc4;
            width: 100%;
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .glass-card {
                padding: 30px 25px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 2.2rem;
            }
            
            body {
                padding: 15px;
            }
            
            .otp-inputs {
                gap: 5px;
            }
            
            .otp-input {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            
            .progress-steps {
                gap: 10px;
            }
            
            .step-circle {
                width: 35px;
                height: 35px;
            }
            
            .step-text {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <!-- Logo -->
        <div class="logo">PocketHisab</div>
        
        <!-- Back to Login -->
        <div class="back-link">
            <a href="/">
                ← Back to Login
            </a>
        </div>

        <!-- Progress Steps -->
        <div class="progress-steps">
            <div class="step active" id="step1">
                <div class="step-circle">1</div>
                <div class="step-text">Enter Email/Mobile</div>
            </div>
            <div class="step" id="step2">
                <div class="step-circle">2</div>
                <div class="step-text">Verify OTP</div>
            </div>
            <div class="step" id="step3">
                <div class="step-circle">3</div>
                <div class="step-text">New Password</div>
            </div>
        </div>

        <!-- Forgot Password Form -->
        <form id="forgotPasswordForm">
            <!-- Step 1: Enter Email/Mobile -->
            <div class="step-content" id="step1Content">
                <div class="form-group">
                    <label for="userInput">Email or Mobile Number *</label>
                    <input type="text" id="userInput" class="form-control" placeholder="Enter your email or mobile number" required>
                </div>

                <button type="button" class="btn btn-primary" onclick="sendOTP()">Send OTP</button>
            </div>

            <!-- Step 2: Verify OTP -->
            <div class="step-content" id="step2Content" style="display: none;">
                <div class="otp-section">
                    <h3 style="text-align: center; margin-bottom: 15px; color: #333;">Verify Your Identity</h3>
                    <p style="text-align: center; color: #666; margin-bottom: 20px;" id="otpSentTo">
                        OTP sent to your registered email/mobile
                    </p>
                    
                    <div class="otp-inputs">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 1)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 2)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 3)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 4)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 5)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 6)">
                    </div>
                    
                    <div class="otp-timer" id="otpTimer">
                        Resend OTP in: <span id="timer">02:00</span>
                    </div>
                    
                    <button type="button" class="btn btn-secondary" onclick="resendOTP()" id="resendBtn" disabled>Resend OTP</button>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="previousStep(1)">← Back</button>
                    <button type="button" class="btn btn-primary" onclick="verifyOTP()">Verify OTP</button>
                </div>
            </div>

            <!-- Step 3: Set New Password -->
            <div class="step-content" id="step3Content" style="display: none;">
                <div class="form-group">
                    <label for="newPassword">New Password *</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required oninput="checkPasswordStrength()">
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="password-requirements" id="passwordRequirements">
                        Password must be at least 6 characters long
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password *</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required oninput="checkPasswordMatch()">
                    <div class="password-requirements" id="passwordMatch" style="display: none; color: #ff6b6b;">
                        Passwords do not match
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn btn-secondary" onclick="previousStep(2)">← Back</button>
                    <button type="button" class="btn btn-primary" onclick="resetPassword()" id="resetBtn">Reset Password</button>
                </div>
            </div>
        </form>

        <!-- Message Box -->
        <div id="message" class="message"></div>
    </div>

    <script>
        let currentStep = 1;
        let userInput = '';
        let otpTimer;
        let canResendOTP = false;

        // Show message function
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }

        // Navigate to next step
        function nextStep(step) {
            // Hide all steps
            document.querySelectorAll('.step-content').forEach(content => {
                content.style.display = 'none';
            });

            // Remove active class from all steps
            document.querySelectorAll('.step').forEach(stepEl => {
                stepEl.classList.remove('active');
            });

            // Add completed class to previous steps
            for (let i = 1; i < step; i++) {
                document.getElementById('step' + i).classList.add('completed');
            }

            // Show selected step
            document.getElementById('step' + step + 'Content').style.display = 'block';
            document.getElementById('step' + step).classList.add('active');

            currentStep = step;
        }

        // Navigate to previous step
        function previousStep(step) {
            nextStep(step);
        }

        // Send OTP
        function sendOTP() {
            userInput = document.getElementById('userInput').value.trim();
            
            if (!userInput) {
                showMessage('Please enter your email or mobile number!', 'error');
                return;
            }

            // Validate email or mobile format
            const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userInput);
            const isMobile = /^01[3-9]\d{8}$/.test(userInput);
            
            if (!isEmail && !isMobile) {
                showMessage('Please enter a valid email or Bangladeshi mobile number!', 'error');
                return;
            }

            // Show loading state
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = 'Sending OTP...';
            btn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
                
                // Update OTP sent message
                document.getElementById('otpSentTo').textContent = 
                    `OTP sent to your ${isEmail ? 'email' : 'mobile number'}`;
                
                // Move to next step
                nextStep(2);
                startOTPTimer();
                
                showMessage('OTP sent successfully!', 'success');
            }, 2000);
        }

        // OTP Timer
        function startOTPTimer() {
            let timeLeft = 120; // 2 minutes
            const timerElement = document.getElementById('timer');
            const resendBtn = document.getElementById('resendBtn');
            
            clearInterval(otpTimer);
            canResendOTP = false;
            resendBtn.disabled = true;
            
            otpTimer = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                
                timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(otpTimer);
                    timerElement.textContent = '00:00';
                    canResendOTP = true;
                    resendBtn.disabled = false;
                }
                
                timeLeft--;
            }, 1000);
        }

        // Move to next OTP input
        function moveToNext(input, nextIndex) {
            if (input.value.length === 1) {
                const nextInput = input.parentElement.querySelector(`.otp-input:nth-child(${nextIndex + 1})`);
                if (nextInput) {
                    nextInput.focus();
                }
            }
        }

        // Resend OTP
        function resendOTP() {
            if (!canResendOTP) return;
            
            startOTPTimer();
            showMessage('OTP resent successfully!', 'success');
        }

        // Verify OTP
        function verifyOTP() {
            const otpInputs = document.querySelectorAll('.otp-input');
            let otp = '';
            
            otpInputs.forEach(input => {
                otp += input.value;
            });
            
            if (otp.length !== 6) {
                showMessage('Please enter the complete 6-digit OTP!', 'error');
                return;
            }

            // Show loading state
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = 'Verifying...';
            btn.disabled = true;

            // Simulate OTP verification
            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
                
                // For demo purposes, assume OTP is correct
                // In real implementation, you would verify with backend
                nextStep(3);
                showMessage('OTP verified successfully!', 'success');
            }, 1500);
        }

        // Check password strength
        function checkPasswordStrength() {
            const password = document.getElementById('newPassword').value;
            const strengthBar = document.getElementById('strengthBar');
            const requirements = document.getElementById('passwordRequirements');
            
            let strength = 0;
            let message = '';
            
            if (password.length >= 6) strength += 1;
            if (password.length >= 8) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;
            
            // Update strength bar
            strengthBar.className = 'strength-bar';
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
                message = 'Weak password';
            } else if (strength <= 4) {
                strengthBar.classList.add('strength-medium');
                message = 'Medium strength password';
            } else {
                strengthBar.classList.add('strength-strong');
                message = 'Strong password';
            }
            
            requirements.textContent = message;
        }

        // Check password match
        function checkPasswordMatch() {
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const matchMessage = document.getElementById('passwordMatch');
            
            if (confirmPassword && password !== confirmPassword) {
                matchMessage.style.display = 'block';
            } else {
                matchMessage.style.display = 'none';
            }
        }

        // Reset Password
        function resetPassword() {
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!password || !confirmPassword) {
                showMessage('Please fill in both password fields!', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('Passwords do not match!', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long!', 'error');
                return;
            }

            // Show loading state
            const btn = document.getElementById('resetBtn');
            const originalText = btn.textContent;
            btn.textContent = 'Resetting...';
            btn.disabled = true;

            // Simulate password reset
            setTimeout(() => {
                showMessage('Password reset successfully! Redirecting to login...', 'success');
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            }, 1500);
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎉 PocketHisab Forgot Password Page Loaded!');
        });
    </script>
</body>
</html>
