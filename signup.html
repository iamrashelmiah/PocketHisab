<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketHisab - Sign Up</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styles */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            padding: 20px;
        }

        /* Rainbow Background Animation */
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 35px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        /* Logo */
        .logo {
            text-align: center;
            font-size: 2.8rem;
            font-weight: bold;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Back to Login */
        .back-link {
            text-align: center;
            margin-bottom: 25px;
        }

        .back-link a {
            color: #333;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-link a:hover {
            color: #ff6b6b;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3);
        }

        /* Checkbox for Same Address */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
        }

        /* Package Selection */
        .package-selection {
            margin: 25px 0;
        }

        .package-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .package-option {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 10px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .package-option:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .package-option.selected {
            background: rgba(255, 255, 255, 0.4);
            border-color: #4ecdc4;
            transform: translateY(-2px);
        }

        .package-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .package-price {
            font-size: 14px;
            color: #666;
            margin-bottom: 3px;
        }

        .package-features {
            font-size: 12px;
            color: #888;
        }

        /* OTP Section */
        .otp-section {
            display: none;
            margin: 20px 0;
            text-align: center;
        }

        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        .otp-input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
        }

        .otp-timer {
            font-size: 14px;
            color: #666;
            margin: 10px 0;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.3);
            color: #333;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* Message Box */
        .message {
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.2);
            color: #2e7d32;
            border: 1px solid #4caf50;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.2);
            color: #c62828;
            border: 1px solid #f44336;
        }

        /* Progress Steps */
        .progress-steps {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .step.active .step-circle {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
        }

        .step-text {
            font-size: 12px;
            color: #666;
        }

        .step.active .step-text {
            color: #333;
            font-weight: 600;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .package-options {
                grid-template-columns: 1fr;
            }
            
            .glass-card {
                padding: 30px 25px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 2.2rem;
            }
            
            body {
                padding: 15px;
            }
            
            .otp-inputs {
                gap: 5px;
            }
            
            .otp-input {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <!-- Logo -->
        <div class="logo">PocketHisab</div>
        
        <!-- Back to Login -->
        <div class="back-link">
            <a href="/">
                ← Back to Login
            </a>
        </div>

        <!-- Progress Steps -->
        <div class="progress-steps">
            <div class="step active" id="step1">
                <div class="step-circle">1</div>
                <div class="step-text">Personal Info</div>
            </div>
            <div class="step" id="step2">
                <div class="step-circle">2</div>
                <div class="step-text">Package</div>
            </div>
            <div class="step" id="step3">
                <div class="step-circle">3</div>
                <div class="step-text">Verify OTP</div>
            </div>
        </div>

        <!-- Sign Up Form -->
        <form id="signupForm">
            <!-- Step 1: Personal Information -->
            <div class="step-content" id="step1Content">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" class="form-control" placeholder="Enter first name" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" class="form-control" placeholder="Enter last name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number *</label>
                    <input type="tel" id="mobile" class="form-control" placeholder="01XXXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required>
                </div>

                <button type="button" class="btn btn-primary" onclick="nextStep(2)">Next → Choose Package</button>
            </div>

            <!-- Step 2: Package Selection -->
            <div class="step-content" id="step2Content" style="display: none;">
                <div class="package-selection">
                    <h3 style="text-align: center; margin-bottom: 20px; color: #333;">Choose Your Package</h3>
                    
                    <div class="package-options">
                        <div class="package-option" onclick="selectPackage('basic')">
                            <div class="package-name">Basic</div>
                            <div class="package-price">৳149/month</div>
                            <div class="package-features">300 SMS</div>
                        </div>
                        
                        <div class="package-option" onclick="selectPackage('standard')">
                            <div class="package-name">Standard</div>
                            <div class="package-price">৳199/month</div>
                            <div class="package-features">400 SMS</div>
                        </div>
                        
                        <div class="package-option" onclick="selectPackage('premium')">
                            <div class="package-name">Premium</div>
                            <div class="package-price">৳249/month</div>
                            <div class="package-features">500 SMS</div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label style="text-align: center; display: block;">Selected Package: <span id="selectedPackageText">None</span></label>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn btn-secondary" onclick="nextStep(1)">← Back</button>
                    <button type="button" class="btn btn-primary" onclick="nextStep(3)">Next → Verify</button>
                </div>
            </div>

            <!-- Step 3: OTP Verification -->
            <div class="step-content" id="step3Content" style="display: none;">
                <div class="otp-section" id="otpSection">
                    <h3 style="text-align: center; margin-bottom: 15px; color: #333;">Verify Your Account</h3>
                    <p style="text-align: center; color: #666; margin-bottom: 20px;">
                        We've sent OTP codes to your mobile and email
                    </p>
                    
                    <div class="otp-inputs">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 1)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 2)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 3)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 4)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 5)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 6)">
                    </div>
                    
                    <div class="otp-timer" id="otpTimer">
                        Resend OTP in: <span id="timer">02:00</span>
                    </div>
                    
                    <button type="button" class="btn btn-secondary" onclick="resendOTP()">Resend OTP</button>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="nextStep(2)">← Back</button>
                    <button type="button" class="btn btn-primary" onclick="verifyOTP()">Verify & Create Account</button>
                </div>
            </div>
        </form>

        <!-- Message Box -->
        <div id="message" class="message"></div>
    </div>

    <script>
        let currentStep = 1;
        let selectedPackage = '';
        let otpTimer;

        // Show message function
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }

        // Navigate between steps
        function nextStep(step) {
            // Validate current step before proceeding
            if (step === 2 && !validateStep1()) return;
            if (step === 3 && !validateStep2()) return;

            // Hide all steps
            document.querySelectorAll('.step-content').forEach(content => {
                content.style.display = 'none';
            });

            // Remove active class from all steps
            document.querySelectorAll('.step').forEach(stepEl => {
                stepEl.classList.remove('active');
            });

            // Show selected step
            document.getElementById('step' + step + 'Content').style.display = 'block';
            document.getElementById('step' + step).classList.add('active');

            currentStep = step;

            // If moving to OTP step, start OTP process
            if (step === 3) {
                startOTPProcess();
            }
        }

        // Validate Step 1 - Personal Information
        function validateStep1() {
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const mobile = document.getElementById('mobile').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!firstName || !lastName || !mobile || !email || !password || !confirmPassword) {
                showMessage('Please fill in all required fields!', 'error');
                return false;
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match!', 'error');
                return false;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long!', 'error');
                return false;
            }

            if (!/^01[3-9]\d{8}$/.test(mobile)) {
                showMessage('Please enter a valid Bangladeshi mobile number!', 'error');
                return false;
            }

            return true;
        }

        // Validate Step 2 - Package Selection
        function validateStep2() {
            if (!selectedPackage) {
                showMessage('Please select a package!', 'error');
                return false;
            }
            return true;
        }

        // Package Selection
        function selectPackage(packageType) {
            selectedPackage = packageType;
            
            // Remove selected class from all packages
            document.querySelectorAll('.package-option').forEach(option => {
                option.classList.remove('selected');
            });
            
            // Add selected class to chosen package
            event.target.closest('.package-option').classList.add('selected');
            
            // Update selected package text
            document.getElementById('selectedPackageText').textContent = 
                packageType.charAt(0).toUpperCase() + packageType.slice(1);
        }

        // Start OTP Process
        function startOTPProcess() {
            document.getElementById('otpSection').style.display = 'block';
            startOTPTimer();
            
            // Simulate sending OTP
            showMessage('OTP sent to your mobile and email!', 'success');
        }

        // OTP Timer
        function startOTPTimer() {
            let timeLeft = 120; // 2 minutes
            const timerElement = document.getElementById('timer');
            
            clearInterval(otpTimer);
            
            otpTimer = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                
                timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(otpTimer);
                    timerElement.textContent = '00:00';
                }
                
                timeLeft--;
            }, 1000);
        }

        // Move to next OTP input
        function moveToNext(input, nextIndex) {
            if (input.value.length === 1) {
                const nextInput = input.parentElement.querySelector(`.otp-input:nth-child(${nextIndex + 1})`);
                if (nextInput) {
                    nextInput.focus();
                }
            }
        }

        // Resend OTP
        function resendOTP() {
            startOTPTimer();
            showMessage('OTP resent successfully!', 'success');
        }

        // Verify OTP and Create Account
        function verifyOTP() {
            // Simulate OTP verification
            showMessage('Account created successfully! Redirecting...', 'success');
            
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎉 PocketHisab Sign Up Page Loaded!');
        });
    </script>
</body>
</html>
